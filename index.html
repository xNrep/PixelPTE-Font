
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>5×5 Matrix Generator</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: #111;
        color: white;
        font-family: Arial, sans-serif;
    }

    .container {
        width: 340px;
        padding: 25px;
        background: #1c1c1c;
        border-radius: 16px;
        text-align: center;
        box-shadow: 0 0 30px rgba(0,0,0,.5);
    }

    h1 {
        margin-top: 0;
        font-size: 24px;
    }

    .grid {
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        gap: 6px;
        width: 250px;
        margin: 20px auto;
    }

    .cell {
        aspect-ratio: 1;
        border: none;
        border-radius: 5px;
        background: #333;
        cursor: pointer;
        transition: .1s;
    }

    .cell.active {
        background: white;
    }

    button {
        border: none;
        border-radius: 8px;
        padding: 10px 14px;
        margin: 4px;
        cursor: pointer;
        font-weight: bold;
    }

    #generate {
        background: #5865f2;
        color: white;
    }

    #clear {
        background: #333;
        color: white;
    }

    #copy {
        background: #44c767;
        color: white;
    }

    #output {
        width: 100%;
        margin-top: 15px;
        padding: 12px;
        border: 1px solid #444;
        border-radius: 8px;
        background: #0b0b0b;
        color: #00ff88;
        font-family: monospace;
        font-size: 15px;
        text-align: center;
        overflow-x: auto;
        white-space: nowrap;
        user-select: all;
    }
</style>
</head>

<body>

<div class="container">

    <h1>5×5 Matrix Generator</h1>

    <div class="grid" id="grid"></div>

    <div>
        <button id="generate">Générer</button>
        <button id="clear">Effacer</button>
        <button id="copy">Copier</button>
    </div>

    <div id="output">0000000000000000000000000</div>

</div>

<script>
const grid = document.getElementById("grid");
const output = document.getElementById("output");

const cells = [];

// Création des 25 cases
for (let i = 0; i < 25; i++) {
    const cell = document.createElement("button");

    cell.className = "cell";

    cell.addEventListener("click", () => {
        cell.classList.toggle("active");
    });

    grid.appendChild(cell);
    cells.push(cell);
}

// Générer la matrice sur une seule ligne
function generateMatrix() {
    let result = "";

    cells.forEach(cell => {
        result += cell.classList.contains("active") ? "1" : "0";
    });

    output.textContent = result;
}

document.getElementById("generate").addEventListener("click", generateMatrix);

// Effacer
document.getElementById("clear").addEventListener("click", () => {
    cells.forEach(cell => {
        cell.classList.remove("active");
    });

    generateMatrix();
});

// Copier
document.getElementById("copy").addEventListener("click", async () => {
    generateMatrix();

    try {
        await navigator.clipboard.writeText(output.textContent);

        const oldText = document.getElementById("copy").textContent;
        document.getElementById("copy").textContent = "Copié !";

        setTimeout(() => {
            document.getElementById("copy").textContent = oldText;
        }, 1000);

    } catch {
        alert("Impossible de copier automatiquement.");
    }
});
</script>

</body>
</html>
